# Paper-only local Docker stack. Deployment to Beast requires separate approval.
services:
  web:
    build:
      context: ./client
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      RUN_MODE: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      MONGO_URI_PROD: mongodb://mongo:27017/trading-bot-paper
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["npm", "run", "worker:15m"]
    profiles: ["trading"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MODE: paper
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      MONGO_URI_PROD: mongodb://mongo:27017/trading-bot-paper
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - trading_mongo:/data/db
    restart: unless-stopped

volumes:
  trading_mongo:
